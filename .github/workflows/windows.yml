name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package and packager
        run: python -m pip install --upgrade pip && python -m pip install -e . pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean AetherSort.spec
      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: AetherSort-windows-x64
          path: dist/AetherSort/
          if-no-files-found: error
