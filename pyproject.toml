[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aethersort"
version = "0.3.0b1"
description = "Local-first desktop file organizer"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
aethersort = "aethersort.app:main"

[tool.setuptools.packages.find]
include = ["aethersort*"]

[tool.pyinstaller]
# Build is driven by AetherSort.spec on Windows.
